name: CI

on:
  push:
    paths:
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - "verify.py"
      - ".github/workflows/**"
      - "atlas/**"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
      # Codecov reads its status and comment settings from this file.
      - "codecov.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - "verify.py"
      - ".github/workflows/**"
      - "atlas/**"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
      # Codecov reads its status and comment settings from this file.
      - "codecov.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # 'true' on the one leg whose coverage and test results go to Codecov,
      # on a pull request or a push to the default branch.
      COVERAGE_LEG: ${{ matrix.python-version == '3.11' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The committed Atlas map (atlas/) must match the tree. Atlas needs
      # Node 22 or later, and the map is the same on every cell, so it is
      # checked on the 3.12 cell only.
      - name: Set up Node for Atlas
        if: matrix.python-version == '3.12'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Atlas check
        if: matrix.python-version == '3.12'
        run: npx --yes @dogfood-lab/atlas@1.24.0 check

      - name: Install
        run: python -m pip install -e ".[dev]" build

      # ONE gate, and the same one the release workflow runs. CI used to run three bare
      # `pytest` legs here; verify.py runs those same three interpreter modes AND builds the
      # dists AND installs the wheel into a clean venv to run a real verb from outside the
      # checkout. Splitting them meant CI could be green on something the release then failed.
      #
      # The three interpreter modes are not redundancy: -O and PYTHONOPTIMIZE delete `assert`,
      # and this package's gates `raise` precisely so they survive it.
      - name: Verify (suite x3 modes, build, clean-venv smoke)
        id: tests
        run: python verify.py

      # The codecov job below uploads what these two steps save; this job
      # never holds an OIDC token. Coverage is saved when the tests passed,
      # and test results whenever they ran, failures included, because a
      # failing test is what that report exists to show. A save step with no
      # file to save fails the job. overwrite lets a re-run of this job
      # replace the artifact its earlier attempt saved.
      - name: Save coverage for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Save test results for Codecov
        if: ${{ !cancelled() && env.COVERAGE_LEG == 'true' && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-test-results
          path: junit.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  codecov:
    # Uploads what the test job saved, from a job of its own, so the OIDC
    # token that signs in to Codecov never exists beside the install and the
    # tests. The checkout, which keeps no token, is there only so Codecov can
    # match report paths to files: the job installs nothing and runs none of
    # the repository's code. It runs whenever the test job ran, failures
    # included, so failing tests still reach Codecov, and only on the events
    # that collect coverage. A run the concurrency group cancels uploads
    # nothing, and each run reads only its own artifacts.
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'cancelled' && needs.test.result != 'skipped' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Each artifact unpacks where the test job wrote its files. A pattern
      # that matches nothing, unlike a name, does not fail: a failing test
      # run saves test results and no coverage.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-coverage
          path: .

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-test-results
          path: .

      # After a passing test job both artifacts exist, so each upload runs,
      # and fails the job if its files are missing; after a failing one each
      # runs when its files arrived. Both sign in with OIDC, fail the job when
      # Codecov refuses the report, and run the Codecov CLI at a fixed version
      # rather than whichever is newest.
      - name: Upload coverage to Codecov
        if: ${{ needs.test.result == 'success' || hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./coverage.xml

      - name: Upload test results to Codecov
        if: ${{ needs.test.result == 'success' || hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./junit.xml

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The package has ZERO runtime dependencies, so this audits the dev/optional surface —
      # pytest, build, and the mcp SDK, which pulls in a real tree (cryptography, starlette,
      # uvicorn, pydantic). A zero-dependency package is not the same as an unaudited one: the
      # extras are what a user installing [mcp] actually gets.
      #
      # This audits the DECLARED dependency surface from pyproject, not an installed environment,
      # and the difference was earned by two red runs:
      #
      #   1. `pip-audit --strict` on the installed env failed with "comfy-preflight: Dependency
      #      not found on PyPI and could not be audited" — the project itself is not on PyPI.
      #   2. Adding `--skip-editable` then failed with "distribution marked as editable", because
      #      `--strict` treats ANY skipped distribution as an error. The two flags are mutually
      #      exclusive by design, so the second fix could never have worked.
      #
      # Auditing the requirements directly removes the project from the question entirely, keeps
      # `--strict` at full force for every real dependency, and audits what a user is actually
      # promised rather than what one CI runner happened to resolve. The list is derived from
      # pyproject, so it cannot drift from the declarations.
      - name: pip-audit (declared dependencies + every extra)
        run: |
          python -m pip install --upgrade pip pip-audit
          python - > /tmp/declared-requirements.txt <<'PY'
          import pathlib, tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          seen = []
          for spec in project.get("dependencies", []):
              seen.append(spec)
          for group in project.get("optional-dependencies", {}).values():
              seen.extend(group)
          print("\n".join(dict.fromkeys(seen)))
          PY
          echo "--- auditing ---"; cat /tmp/declared-requirements.txt
          pip-audit --strict -r /tmp/declared-requirements.txt --progress-spinner off
