name: CI

on:
  push:
    paths:
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - "verify.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - "verify.py"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]" build

      # ONE gate, and the same one the release workflow runs. CI used to run three bare
      # `pytest` legs here; verify.py runs those same three interpreter modes AND builds the
      # dists AND installs the wheel into a clean venv to run a real verb from outside the
      # checkout. Splitting them meant CI could be green on something the release then failed.
      #
      # The three interpreter modes are not redundancy: -O and PYTHONOPTIMIZE delete `assert`,
      # and this package's gates `raise` precisely so they survive it.
      - name: Verify (suite x3 modes, build, clean-venv smoke)
        run: python verify.py

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The package has ZERO runtime dependencies, so this audits the dev/optional surface —
      # pytest, build, and the mcp SDK, which pulls in a real tree (cryptography, starlette,
      # uvicorn, pydantic). A zero-dependency package is not the same as an unaudited one: the
      # extras are what a user installing [mcp] actually gets.
      #
      # This audits the DECLARED dependency surface from pyproject, not an installed environment,
      # and the difference was earned by two red runs:
      #
      #   1. `pip-audit --strict` on the installed env failed with "comfy-preflight: Dependency
      #      not found on PyPI and could not be audited" — the project itself is not on PyPI.
      #   2. Adding `--skip-editable` then failed with "distribution marked as editable", because
      #      `--strict` treats ANY skipped distribution as an error. The two flags are mutually
      #      exclusive by design, so the second fix could never have worked.
      #
      # Auditing the requirements directly removes the project from the question entirely, keeps
      # `--strict` at full force for every real dependency, and audits what a user is actually
      # promised rather than what one CI runner happened to resolve. The list is derived from
      # pyproject, so it cannot drift from the declarations.
      - name: pip-audit (declared dependencies + every extra)
        run: |
          python -m pip install --upgrade pip pip-audit
          python - > /tmp/declared-requirements.txt <<'PY'
          import pathlib, tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          seen = []
          for spec in project.get("dependencies", []):
              seen.append(spec)
          for group in project.get("optional-dependencies", {}).values():
              seen.extend(group)
          print("\n".join(dict.fromkeys(seen)))
          PY
          echo "--- auditing ---"; cat /tmp/declared-requirements.txt
          pip-audit --strict -r /tmp/declared-requirements.txt --progress-spinner off
