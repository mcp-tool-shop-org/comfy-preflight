name: CI

on:
  push:
    paths:
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - "verify.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - "verify.py"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]" build

      # ONE gate, and the same one the release workflow runs. CI used to run three bare
      # `pytest` legs here; verify.py runs those same three interpreter modes AND builds the
      # dists AND installs the wheel into a clean venv to run a real verb from outside the
      # checkout. Splitting them meant CI could be green on something the release then failed.
      #
      # The three interpreter modes are not redundancy: -O and PYTHONOPTIMIZE delete `assert`,
      # and this package's gates `raise` precisely so they survive it.
      - name: Verify (suite x3 modes, build, clean-venv smoke)
        run: python verify.py

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The package has ZERO runtime dependencies, so this audits the dev/optional surface —
      # pytest, build, and the mcp SDK, which pulls in a real tree (cryptography, starlette,
      # uvicorn, pydantic). A zero-dependency package is not the same as an unaudited one: the
      # extras are what a user installing [mcp] actually gets.
      #
      # `--skip-editable` is load-bearing, not noise-suppression. Without it `--strict` fails
      # with "comfy-preflight: Dependency not found on PyPI and could not be audited" — the
      # editable install of the project itself is not on PyPI, which is a chicken-and-egg that
      # would fail forever on an unpublished package and keep failing for no useful reason after
      # publication. The subject of this audit is the dependency tree, not the package under
      # test. `--strict` stays, so any OTHER dependency that cannot be audited is still an error.
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e ".[dev]"
          pip-audit --strict --skip-editable --progress-spinner off
