name: CI

on:
  push:
    paths:
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      # The gates must survive assert-stripping. A check that decides whether an
      # irreversible step proceeds cannot be a bare `assert`: -O deletes it silently and
      # execution continues past it. This leg fails if any gate degrades to an assert.
      - name: Test under -O (assert-stripped)
        run: python -O -m pytest

      - name: Test under PYTHONOPTIMIZE=1
        env:
          PYTHONOPTIMIZE: "1"
        run: python -m pytest
